name: Validate and Create Pull Request

on:
  push:
    branches:
      - "test-branch/**"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate HTML Application
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: List repository files
        run: ls -la

      - name: Check index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html was not found"
            exit 1
          fi

          echo "SUCCESS: index.html exists"

      - name: Check heading exists
        run: |
          if ! grep -q "<h1>" index.html; then
            echo "ERROR: index.html does not contain an h1 heading"
            exit 1
          fi

          echo "SUCCESS: h1 heading exists"

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Check and create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --head test-branch \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists"
          else
            gh pr create \
              --head test-branch \
              --base main \
              --title "Merge test-branch into main" \
              --body "This PR was created automatically by GitHub Actions."
          fi
