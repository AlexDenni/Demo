name: Validate and Create Pull Request

on:
  push:
    branches:
      - "feature/**"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate HTML Application
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: List repository files
        run: ls -la

      - name: Check index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html was not found"
            exit 1
          fi

          echo "SUCCESS: index.html exists"

      - name: Check heading exists
        run: |
          if ! grep -q "<h1>" index.html; then
            echo "ERROR: index.html does not contain an h1 heading"
            exit 1
          fi

          echo "SUCCESS: h1 heading exists"

  create-pull-request:
    name: Create Pull Request
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Create PR if one does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --head "$GITHUB_REF_NAME" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #$EXISTING_PR already exists"
          else
            gh pr create \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --title "Merge $GITHUB_REF_NAME into main" \
              --body "This pull request was created automatically after successful validation."
          fi
